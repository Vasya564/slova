<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>слова</title>
<meta name="description" content="Дванадцять слів сховані між літер. Проведи по буквах і знайди їх.">
<meta name="theme-color" content="#eef0f8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fffdf9'/%3E%3Crect x='4' y='14' width='24' height='7' rx='3.5' fill='%23d7ccf3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="masthead">
    <p class="wordmark">слова</p>
    <div class="levels" id="levels" aria-label="Рівні"></div>
  </header>

  <main class="stage">

    <section class="screen cover" id="intro" data-active>
      <h1>дванадцять<br>слів</h1>
      <p>Вони сховались між літер. <span class="marked">Буквально.</span></p>
      <p class="rules">Проведи по буквах — мишкою або пальцем. Слово лежить рівно: у рядку, у стовпчику або по діагоналі. З кожним рівнем сітка більша, а слова довші.</p>
      <button class="button" id="start">почати</button>
    </section>

    <section class="screen" id="game">
      <div class="board">
        <div class="sheet" id="sheet">
          <div class="grid-wrap">
            <div class="grid" id="grid" role="grid" aria-label="Сітка з літерами"></div>
            <svg class="marks" id="marks" preserveAspectRatio="none" aria-hidden="true"></svg>
          </div>
        </div>

        <aside class="panel">
          <h2 class="eyebrow">знайди</h2>
          <div class="words" id="words"></div>
          <div class="hint-line">
            <span class="tally" id="tally"></span>
            <span class="controls">
              <button class="button quiet sound" id="sound" aria-pressed="true">звук</button>
              <button class="button quiet" id="hint">підказка</button>
            </span>
          </div>
          <p class="note" id="note"></p>
        </aside>
      </div>
    </section>

    <section class="screen cover finale" id="finale">
      <h1>лублу</h1>
      <p>Усі дванадцять знайдено.</p>
      <ul class="collected" id="collected"></ul>
      <button class="button" id="again">зіграти ще</button>
    </section>

  </main>
</div>

<div class="curtain" id="card">
  <div class="curtain-card">
    <h2 id="card-title"></h2>
    <p id="card-text"></p>
    <button class="button" id="card-close"></button>
  </div>
</div>

<div class="curtain" id="curtain">
  <div class="curtain-card">
    <h2 id="curtain-title"></h2>
    <p id="curtain-note"></p>
    <button class="button" id="next">далі</button>
  </div>
</div>

<span id="announce" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap"></span>

<script type="module" src="game.js"></script>
</body>
</html>
